name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.2', '8.3']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --no-check-publish --no-check-all

      - name: Install dependencies
        # fzaninotto/faker caps PHP at ^7.0 even though it runs on PHP 8, so the
        # upper-bound PHP check is ignored. Drop the flag once the plugin depends
        # on fakerphp/faker.
        run: composer install --no-interaction --no-progress --prefer-dist --ignore-platform-req=php+

      - name: Run tests
        run: composer test
